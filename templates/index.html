<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="wrap">
        <header>
            <h1>Unit Converter</h1>
            <p class="sub">Length, weight and temperature.</p>
        </header>

        <section class="card">
            <label for="category">Type</label>
            <select id="category"></select>

            <label for="value">Value</label>
            <input id="value" type="number" step="any" value="1">

            <div class="pair">
                <div>
                    <label for="from">From</label>
                    <select id="from"></select>
                </div>
                <button id="swap" type="button" aria-label="Swap units">&#8644;</button>
                <div>
                    <label for="to">To</label>
                    <select id="to"></select>
                </div>
            </div>

            <p id="result" class="result" aria-live="polite"></p>
        </section>

        <footer>Flask + GitHub Actions</footer>
    </main>

    <script id="units" type="application/json">{{ units|tojson }}</script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>

</html>
